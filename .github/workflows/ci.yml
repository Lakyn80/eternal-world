name: CI

on:
  push:
    branches:
      - main
      - staging/**
  pull_request:

jobs:
  backend-tests:
    if: github.event_name != 'push' || github.ref_name == 'main'
    runs-on: ubuntu-latest

    # Task 65.7 browser-session cookies and chat Redis snapshots need a live
    # Redis. Login itself must still succeed without Redis (bearer JWT), but
    # cookie-path and resume tests require this service.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run backend tests
        working-directory: backend
        env:
          PYTHONPATH: .
          REDIS_URL: redis://localhost:6379/0
        run: python -m pytest

  frontend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Run frontend typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run responsive E2E tests
        working-directory: frontend
        run: npm run test:e2e
