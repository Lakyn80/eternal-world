global:
  scrape_interval: 15s

scrape_configs:
  - job_name: eternal_world_backend
    metrics_path: /metrics
    static_configs:
      - targets:
          - backend:8000

  # Scraped only when profile `celery-observability` is running
  # (`celery_exporter` service). When the profile is off, this target is DOWN —
  # that is expected and must not be treated as a Celery outage.
  - job_name: eternal_world_celery_exporter
    metrics_path: /metrics
    static_configs:
      - targets:
          - celery_exporter:9808
