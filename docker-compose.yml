services:
  db:
    image: postgres:16-alpine
    container_name: eternal_world_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: eternal_world
      POSTGRES_USER: eternal_user
      POSTGRES_PASSWORD: eternal_password
    ports:
      - "5432:5432"
    volumes:
      - eternal_world_postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eternal_world_backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eternal_world_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  eternal_world_postgres_data:
