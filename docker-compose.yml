services:
  db:
    image: postgres:16-alpine
    container_name: eternal_world_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: eternal_world
      POSTGRES_USER: eternal_user
      POSTGRES_PASSWORD: eternal_password
    ports:
      - "5543:5432"
    volumes:
      - eternal_world_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: eternal_world_redis
    restart: unless-stopped
    ports:
      - "6384:6379"
    volumes:
      - eternal_world_redis_data:/data

  qdrant:
    image: qdrant/qdrant:v1.13.6
    container_name: eternal_world_qdrant
    restart: unless-stopped
    ports:
      - "6335:6333"
    volumes:
      - eternal_world_qdrant_data:/qdrant/storage

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eternal_world_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://eternal_user:eternal_password@db:5432/eternal_world
      REDIS_URL: redis://redis:6379/0
      APP_NAME: Eternal World API
      ENVIRONMENT: local
      BACKEND_CORS_ORIGINS: http://localhost:8017,http://127.0.0.1:8017
      AI_BRAIN_PROVIDER: openai_compatible
      AI_BRAIN_MODEL: ${AI_BRAIN_MODEL}
      AI_BRAIN_BASE_URL: ${AI_BRAIN_BASE_URL}
      AI_BRAIN_API_KEY: ${AI_BRAIN_API_KEY}
      AI_BRAIN_TIMEOUT_SECONDS: 30
      CONTENT_TRANSLATION_PROVIDER: openai_compatible
      CONTENT_TRANSLATION_MODEL: ${AI_BRAIN_MODEL}
      CONTENT_TRANSLATION_BASE_URL: ${AI_BRAIN_BASE_URL}
      CONTENT_TRANSLATION_API_KEY: ${AI_BRAIN_API_KEY}
      CONTENT_TRANSLATION_TIMEOUT_SECONDS: 20
      EMBEDDING_PROVIDER: sentence_transformers
      SENTENCE_TRANSFORMERS_DEVICE: cpu
      SENTENCE_TRANSFORMERS_CACHE_DIR: /models/huggingface
      CUDA_VISIBLE_DEVICES: ""
      NVIDIA_VISIBLE_DEVICES: void
      MEDIA_STORAGE_PROVIDER: local
      MEDIA_ROOT: /app/media
      MEDIA_PUBLIC_BASE_URL: /media
      MEDIA_MAX_FILE_SIZE_BYTES: 20971520
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION_NAME: eternal_world_rag_chunks
      QDRANT_TIMEOUT_SECONDS: 10
      QDRANT_INDEXING_ENABLED: "true"
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      CELERY_TASK_ALWAYS_EAGER: "false"
      CELERY_TASK_EAGER_PROPAGATES: "false"
    ports:
      - "8033:8000"
    depends_on:
      - db
      - redis
      - qdrant
    volumes:
      - ./backend:/app
      - ./packages/rag-embedding-benchmark:/packages/rag-embedding-benchmark
      - eternal_world_bge_m3_cache:/models/huggingface

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eternal_world_celery_worker
    restart: unless-stopped
    command: celery -A app.worker.celery_app.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql+psycopg://eternal_user:eternal_password@db:5432/eternal_world
      REDIS_URL: redis://redis:6379/0
      APP_NAME: Eternal World API
      ENVIRONMENT: local
      BACKEND_CORS_ORIGINS: http://localhost:8017,http://127.0.0.1:8017
      AI_BRAIN_PROVIDER: mock
      AI_BRAIN_TIMEOUT_SECONDS: 30
      CONTENT_TRANSLATION_PROVIDER: mock
      EMBEDDING_PROVIDER: sentence_transformers
      SENTENCE_TRANSFORMERS_DEVICE: cpu
      SENTENCE_TRANSFORMERS_CACHE_DIR: /models/huggingface
      CUDA_VISIBLE_DEVICES: ""
      NVIDIA_VISIBLE_DEVICES: void
      MEDIA_STORAGE_PROVIDER: local
      MEDIA_ROOT: /app/media
      MEDIA_PUBLIC_BASE_URL: /media
      MEDIA_MAX_FILE_SIZE_BYTES: 20971520
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION_NAME: eternal_world_rag_chunks
      QDRANT_TIMEOUT_SECONDS: 10
      QDRANT_INDEXING_ENABLED: "true"
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      CELERY_TASK_ALWAYS_EAGER: "false"
      CELERY_TASK_EAGER_PROPAGATES: "false"
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app
      - eternal_world_bge_m3_cache:/models/huggingface

  # Task 65.9 (Part H/N/AC) - dedicated embedding worker. The ONLY process
  # in this stack that should ever load the real BGE-M3 provider for
  # indexing work (never FastAPI, never the general celery_worker for new
  # embedding-heavy tasks - see queue routing in app/worker/celery_app.py).
  # concurrency=1 + prefetch-multiplier=1: exactly one embedding job in
  # flight per process, so throughput is scaled by adding replicas
  # (`docker compose up -d --scale embedding_worker=N`), never by
  # oversubscribing one Python process against one loaded model object.
  # No published port. `restart: unless-stopped` is the only recovery
  # mechanism this container relies on if bounded self-healing (Part M/N)
  # ever exhausts its in-process retries and exits deliberately.
  embedding_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eternal_world_embedding_worker
    restart: unless-stopped
    command: >
      celery -A app.worker.celery_app.celery_app worker
      -Q embedding
      --concurrency=1
      --prefetch-multiplier=1
      --loglevel=info
      -n embedding_worker@%h
    environment:
      DATABASE_URL: postgresql+psycopg://eternal_user:eternal_password@db:5432/eternal_world
      REDIS_URL: redis://redis:6379/0
      APP_NAME: Eternal World API
      ENVIRONMENT: local
      BACKEND_CORS_ORIGINS: http://localhost:8017,http://127.0.0.1:8017
      AI_BRAIN_PROVIDER: mock
      AI_BRAIN_TIMEOUT_SECONDS: 30
      CONTENT_TRANSLATION_PROVIDER: mock
      EMBEDDING_PROVIDER: sentence_transformers
      SENTENCE_TRANSFORMERS_DEVICE: cpu
      SENTENCE_TRANSFORMERS_CACHE_DIR: /models/huggingface
      CUDA_VISIBLE_DEVICES: ""
      NVIDIA_VISIBLE_DEVICES: void
      MEDIA_STORAGE_PROVIDER: local
      MEDIA_ROOT: /app/media
      MEDIA_PUBLIC_BASE_URL: /media
      MEDIA_MAX_FILE_SIZE_BYTES: 20971520
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION_NAME: eternal_world_rag_chunks
      QDRANT_TIMEOUT_SECONDS: 10
      QDRANT_INDEXING_ENABLED: "true"
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      CELERY_TASK_ALWAYS_EAGER: "false"
      CELERY_TASK_EAGER_PROPAGATES: "false"
      #: Safe here only: this is the one container type allowed to exit
      #: itself on exhausted provider self-healing (Part M/N), relying on
      #: `restart: unless-stopped` above to recreate it.
      EMBEDDING_WORKER_SELF_RECYCLE_ENABLED: "true"
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app
      - eternal_world_bge_m3_cache:/models/huggingface

  # Task 65.9 (Part E/P/AC) - lightweight maintenance worker: outbox
  # dispatch + stale-job recovery only (embedded beat via `-B`). Never
  # loads an embedding provider, never handles user-facing product work.
  maintenance_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eternal_world_maintenance_worker
    restart: unless-stopped
    command: >
      celery -A app.worker.celery_app.celery_app worker
      -Q maintenance
      --concurrency=1
      --loglevel=info
      -B
      -n maintenance_worker@%h
    environment:
      DATABASE_URL: postgresql+psycopg://eternal_user:eternal_password@db:5432/eternal_world
      REDIS_URL: redis://redis:6379/0
      APP_NAME: Eternal World API
      ENVIRONMENT: local
      BACKEND_CORS_ORIGINS: http://localhost:8017,http://127.0.0.1:8017
      AI_BRAIN_PROVIDER: mock
      CONTENT_TRANSLATION_PROVIDER: mock
      EMBEDDING_PROVIDER: mock
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION_NAME: eternal_world_rag_chunks
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      CELERY_TASK_ALWAYS_EAGER: "false"
      CELERY_TASK_EAGER_PROPAGATES: "false"
      JOB_OUTBOX_DISPATCH_BATCH_SIZE: "50"
      JOB_STALE_HEARTBEAT_TIMEOUT_SECONDS: "300"
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eternal_world_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:8033
    ports:
      - "8017:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/react-export/node_modules

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: eternal_world_prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - backend
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - eternal_world_prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:11.1.5
    container_name: eternal_world_grafana
    profiles:
      - standalone-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - eternal_world_grafana_data:/var/lib/grafana

volumes:
  eternal_world_postgres_data:
  eternal_world_redis_data:
  eternal_world_qdrant_data:
  eternal_world_prometheus_data:
  eternal_world_grafana_data:
  eternal_world_bge_m3_cache:
