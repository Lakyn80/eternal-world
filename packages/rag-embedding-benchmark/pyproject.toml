[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-embedding-benchmark"
version = "0.2.1"
description = "Compare RAG embedding models against a custom eval dataset using your existing DB and Qdrant stack."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
sql-qdrant = [
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "qdrant-client>=1.9,<1.14",
  "sentence-transformers>=3.0",
  "transformers>=4.40",
]
bm25 = [
  "bm25s>=0.2",
]
sql-qdrant-bm25 = [
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "qdrant-client>=1.9,<1.14",
  "sentence-transformers>=3.0",
  "transformers>=4.40",
  "bm25s>=0.2",
]
eternal-world = [
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "qdrant-client>=1.9,<1.14",
  "sentence-transformers>=3.0",
  "transformers>=4.40",
]
dev = [
  "pytest>=8.0",
]

[project.scripts]
rag-eval = "rag_eval.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["rag_eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
